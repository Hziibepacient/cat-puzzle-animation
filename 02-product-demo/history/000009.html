<!doctype html>
<html lang="zh-CN" data-composition-variables='[

    font-weight: 500;
    font-display: swap;
  }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  #film {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: #25211e;
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;

  img, video { display: block; }
  .stage {
    position: absolute;

    position: absolute;

    position: absolute;
    right: -180px;
    bottom: 167px;

    height: 1px;

    left: 185px;

  .brand-line {

    top: 620px;
    left: 189px;

    letter-spacing: .075em;

  .brand-line--end { opacity: 0; }
  .assistant-emblem {
    position: absolute;
    left: 255px;
    top: 324px;
    width: 427px;
    height: 427px;
    display: grid;
    place-items: center;
    opacity: 0;
  }
  .emblem-ring {
    position: absolute;
    inset: 0;
    border: 2px solid #fff9ec;
    border-radius: 50%;
    background: radial-gradient(circle at 42% 36%, #fff6dc, #ead8ba 63%, #d7ba97);
    box-shadow: 0 38px 70px #94664d29, inset 0 4px 14px #ffffffae;
  }
  .emblem-ring::after {
    content: "";
    position: absolute;
    inset: 36px;
    border: 1px solid #fff9ec;
    border-radius: 50%;
  }
  .assistant-emblem img {
    position: relative;
    width: 243px;
    filter: drop-shadow(0 20px 11px #9b71533b);
  }
  .print {
    position: absolute;
    top: 321px;
    left: 185px;
    width: 575px;
    box-sizing: border-box;
    margin: 0;
    padding: 17px 17px 43px;
    background: #fffbf3;
    border-radius: 7px;
    box-shadow: 0 32px 60px #73503233, 0 4px 10px #6b503720;
    opacity: 0;
  }
  .print img {
    width: 100%;
    height: 360px;
    object-fit: cover;
    border-radius: 2px;
  }
  .handset {
    position: absolute;
    box-sizing: border-box;
    top: 38px;
    left: 1085px;
    width: 480px;
    height: 1004px;
    border-radius: 58px;
    border: 2px solid #686266;
    background: linear-gradient(145deg, #68666a, #373638 26%, #1b1a1c 66%, #525055);
    box-shadow:
      0 1px 0 1px #181719,
      0 0 0 2px #c2b9b2,
      0 29px 56px #38261938,
      22px 55px 90px #4d332b40,
      inset 0 0 4px 1px #221e21;
  }
  .handset::before, .handset::after {
    content: "";
    position: absolute;
    width: 4px;
    background: linear-gradient(90deg, #575459, #241f24);
    border-radius: 3px;
  }
  .handset::before {
    left: -6px;
    top: 203px;
    height: 55px;
    box-shadow: 0 73px #454246;
  }
  .handset::after { right: -6px; top: 268px; height: 87px; }
  .glass {
    position: absolute;
    inset: 10px 13px;
    overflow: hidden;
    border-radius: 44px;
    outline: 4px solid #19181a;
    background: #f7f7f7;
  }
  .glass video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #f7f7f7;
  }
</style>

<script>

    .addLabel('scene:catalog', beat(32))
