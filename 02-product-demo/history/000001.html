<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"paper","type":"color","label":"纸面底色","default":"#f5eee4"},
  {"id":"line","type":"string","label":"片尾文案","default":"因为一只猫，认识彼此。"}
]'>
<head>
<meta charset="utf-8">
<title>Only Cats · 校园偶遇</title>
<script src="../vendor/gsap.min.js"></script>
<script src="../vendor/om.js"></script>
<style>
  @font-face {
    font-family: "Noto Sans SC";
    src: url("../assets/fonts/NotoSansSC-500.woff") format("woff");
    font-weight: 500;
    font-display: swap;
  }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  #film {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: #25211e;
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  img, video { display: block; }
  .stage, .end, #story { position: absolute; inset: 0; }
  #story {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: 56% 56%;
  }
  .stage, .end {
    background:
      radial-gradient(ellipse at 69% 22%, #fffaf4 0, transparent 55%),
      radial-gradient(ellipse at 6% 95%, #dbc3ab 0, transparent 64%),
      var(--paper);
    opacity: 0;
  }
  .window-light {
    position: absolute;
    inset: -125px -140px;
    background:
      linear-gradient(110deg, transparent 18%, #fff9ec6e 18.2%, #fffaf538 32%, transparent 48%),
      linear-gradient(110deg, transparent 65%, #92674712 65.4%, transparent 80%);
    transform: translateX(-110px);
  }
  .desk-line {
    position: absolute;
    right: -180px;
    bottom: 167px;
    width: 2280px;
    height: 1px;
    transform: rotate(-11deg);
    background: linear-gradient(90deg, transparent 2%, #a7816146 40%, #b5936f1b 74%, transparent);
  }
  .stage-wordmark {
    position: absolute;
    top: 453px;
    left: 185px;
    width: 615px;
    transform-origin: top left;
  }
  .assistant-emblem {
    position: absolute;
    left: 255px;
    top: 324px;
    width: 427px;
    height: 427px;
    display: grid;
    place-items: center;
    opacity: 0;
  }
  .emblem-ring {
    position: absolute;
    inset: 0;
    border: 2px solid #fff9ec;
    border-radius: 50%;
    background: radial-gradient(circle at 42% 36%, #fff6dc, #ead8ba 63%, #d7ba97);
    box-shadow: 0 38px 70px #94664d29, inset 0 4px 14px #ffffffae;
  }
  .emblem-ring::after {
    content: "";
    position: absolute;
    inset: 36px;
    border: 1px solid #fff9ec;
    border-radius: 50%;
  }
  .assistant-emblem img {
    position: relative;
    width: 243px;
    filter: drop-shadow(0 20px 11px #9b71533b);
  }
  .print {
    position: absolute;
    top: 321px;
    left: 185px;
    width: 575px;
    box-sizing: border-box;
    margin: 0;
    padding: 17px 17px 43px;
    background: #fffbf3;
    border-radius: 7px;
    box-shadow: 0 32px 60px #73503233, 0 4px 10px #6b503720;
    opacity: 0;
  }
  .print img {
    width: 100%;
    height: 360px;
    object-fit: cover;
    border-radius: 2px;
  }
  .handset {
    position: absolute;
    box-sizing: border-box;
    top: 52px;
    left: 1115px;
    width: 466px;
    height: 976px;
    border-radius: 58px;
    border: 2px solid #686266;
    background: linear-gradient(145deg, #68666a, #373638 26%, #1b1a1c 66%, #525055);
    box-shadow:
      0 1px 0 1px #181719,
      0 0 0 2px #c2b9b2,
      0 29px 56px #38261938,
      22px 55px 90px #4d332b40,
      inset 0 0 4px 1px #221e21;
  }
  .handset::before, .handset::after {
    content: "";
    position: absolute;
    width: 4px;
    background: linear-gradient(90deg, #575459, #241f24);
    border-radius: 3px;
  }
  .handset::before {
    left: -6px;
    top: 203px;
    height: 55px;
    box-shadow: 0 73px #454246;
  }
  .handset::after { right: -6px; top: 268px; height: 87px; }
  .glass {
    position: absolute;
    inset: 10px 13px;
    overflow: hidden;
    border-radius: 44px;
    outline: 4px solid #19181a;
    background: #f7f7f7;
  }
  .glass video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #f7f7f7;
  }
  .end {
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at 51% 42%, #fffaf1 0, #f5e9da 63%, transparent 93%),
      var(--paper);
  }
  .end-lockup {
    display: grid;
    justify-items: center;
    gap: 36px;
    padding-bottom: 24px;
  }
  .end img { width: 702px; }
  .end p {
    margin: 0;
    font-size: 41px;
    line-height: 1.4;
    font-weight: 500;
    letter-spacing: .1em;
  }
</style>
</head>
<body>
<main id="film" data-composition-id="film" data-width="1920" data-height="1080" data-duration="30">
  <video id="story" data-om-id="campus-story" src="../out/drafts/unused-materials/story.mp4" poster="../out/drafts/unused-materials/story.jpg"
    data-start="0" data-duration="6" muted playsinline></video>

  <section class="stage">
    <div class="window-light"></div>
    <div class="desk-line"></div>
    <img class="stage-wordmark" src="../materials/wordmark.png" alt="Only Cats" data-om-id="stage-wordmark">
    <div class="assistant-emblem" data-om-id="cilly-emblem">
      <div class="emblem-ring"></div>
      <img src="../materials/cilly.png" alt="Cilly">
    </div>
    <figure class="print" data-om-id="tietie-print">
      <img src="../materials/tietie.jpg" alt="图书馆门口的贴贴">
    </figure>
    <div class="handset" data-om-id="phone">
      <div class="glass">
        <video id="welcome" src="../materials/01-welcome.mp4" poster="../materials/01-welcome.jpg"
          data-om-id="welcome-ui" data-start="5.67" data-duration="4.33" data-layout-allow-overlap muted playsinline></video>
        <video id="assistant" src="../materials/02-assistant.mp4" poster="../materials/02-assistant.jpg"
          data-om-id="assistant-ui" data-start="10" data-duration="4.24" data-layout-allow-overlap muted playsinline></video>
        <video id="square" src="../materials/03-square.mp4" poster="../materials/03-square.jpg"
          data-om-id="square-ui" data-start="14" data-duration="4.24" data-layout-allow-overlap muted playsinline></video>
        <video id="catalog" src="../materials/04-catalog.mp4" poster="../materials/04-catalog.jpg"
          data-om-id="catalog-ui" data-start="18" data-duration="4.24" data-layout-allow-overlap muted playsinline></video>
        <video id="messages" src="../materials/05-messages.mp4" poster="../materials/05-messages.jpg"
          data-om-id="messages-ui" data-start="22" data-duration="4.24" data-layout-allow-overlap muted playsinline></video>
      </div>
    </div>
  </section>

  <section class="end">
    <div class="end-lockup">
      <img src="../materials/wordmark.png" alt="Only Cats" data-om-id="end-wordmark">
      <p data-om-id="end-line" data-var-text="line">因为一只猫，认识彼此。</p>
    </div>
  </section>
</main>

<script>
  OM.music({ bpm: 120 });
  const tl = gsap.timeline({ paused: true });
  const beat = OM.beat;
  tl.addLabel('scene:story', 0)
    .addLabel('scene:welcome', beat(12))
    .addLabel('scene:assistant', beat(20))
    .addLabel('scene:square', beat(28))
    .addLabel('scene:catalog', beat(36))
    .addLabel('scene:messages', beat(44))
    .addLabel('scene:brand', beat(52));

  tl.fromTo('#story', { scale: 1 }, { scale: 1.036, duration: 5.95, ease: 'none' }, 0);
  tl.fromTo('.stage', { opacity: 0 }, { opacity: 1, duration: .30, ease: 'power2.inOut' }, 5.67);
  tl.fromTo('.window-light', { x: -110 }, { x: 105, duration: 20.55, ease: 'sine.inOut' }, 5.67);
  tl.fromTo('.stage-wordmark',
    { y: 0, scale: 1 }, { y: -318, scale: .45, duration: .50, ease: 'power3.inOut' }, 9.78);
  tl.fromTo('.assistant-emblem',
    { opacity: 0, scale: .82, y: 22 },
    { opacity: 1, scale: 1, y: 0, duration: .64, ease: 'power3.out', immediateRender: false }, 10.05);
  tl.fromTo('.assistant-emblem',
    { opacity: 1, scale: 1, y: 0 },
    { opacity: 0, scale: .96, y: -12, duration: .40, ease: 'power2.in', immediateRender: false }, 13.68);
  tl.fromTo('.print',
    { opacity: 0, rotation: -9, y: 80, scale: .89 },
    { opacity: 1, rotation: -4, y: 0, scale: 1, duration: .76, ease: 'power3.out', immediateRender: false }, 14.02);
  tl.fromTo('.print',
    { rotation: -4, y: 0, scale: 1 },
    { rotation: -1.4, y: -9, scale: 1.038, duration: 1.60, ease: 'sine.inOut', immediateRender: false }, 18.0);
  tl.fromTo('.print',
    { rotation: -1.4, y: -9, scale: 1.038 },
    { rotation: -4, y: 18, scale: .95, duration: 1.45, ease: 'sine.inOut', immediateRender: false }, 22.04);

  // The body stays fixed. A quick bottom-to-top reveal changes the surface within the glass.
  for (const [id, at] of [['assistant', 10], ['square', 14], ['catalog', 18], ['messages', 22]]) {
    tl.fromTo('#' + id,
      { clipPath: 'inset(100% 0 0 0)' },
      { clipPath: 'inset(0% 0 0 0)', duration: .18, ease: 'power2.out', immediateRender: false }, at);
  }
  tl.fromTo('.end', { opacity: 0 }, { opacity: 1, duration: .24, ease: 'power2.inOut' }, 26);
  tl.fromTo('.end-lockup img',
    { y: 22, scale: .96 }, { y: 0, scale: 1, duration: .75, ease: 'power3.out' }, 26);
  tl.fromTo('.end-lockup p',
    { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .62, ease: 'power2.out' }, 26.35);
  tl.to({}, { duration: .5 }, 29.5);

  window.__timelines.film = tl;
</script>
</body>
</html>
